# Candidate only: integrate through the existing BaoTa-managed site after
# backing up its config. Do not install a second nginx or overwrite certificates.
server {
    listen 80;
    server_name www.jasonshelter.com jasonshelter.com;
    include /www/server/panel/vhost/nginx/well-known/www.jasonshelter.com.conf;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/www.jasonshelter.com;
        try_files $uri =404;
    }
    location / {
        return 308 https://www.jasonshelter.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name jasonshelter.com;
    ssl_certificate /www/server/panel/vhost/cert/www.jasonshelter.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.jasonshelter.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/www.jasonshelter.com;
        try_files $uri =404;
    }
    location / {
        return 308 https://www.jasonshelter.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.jasonshelter.com;
    ssl_certificate /www/server/panel/vhost/cert/www.jasonshelter.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.jasonshelter.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /www/server/panel/vhost/nginx/well-known/www.jasonshelter.com.conf;
    client_max_body_size 14m;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/www.jasonshelter.com;
        try_files $uri =404;
    }
    location ~ (^|/)\. {
        deny all;
    }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    access_log /www/wwwlogs/folio-studio.access.log;
    error_log /www/wwwlogs/folio-studio.error.log;
}
