name: folio-studio
services:
  studio:
    # Set this to the exact immutable sha256 image ID recorded after the build.
    image: ${FOLIO_IMAGE:?Set FOLIO_IMAGE to the verified application image ID}
    pull_policy: never
    init: true
    user: '10001:10001'
    working_dir: /app
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 768m
    mem_reservation: 128m
    cpus: 1.5
    pids_limit: 192
    tmpfs:
      - /tmp:size=268435456,mode=1777,uid=10001,gid=10001
    volumes:
      - type: bind
        source: /www/dk_project/folio-studio/shared/data
        target: /data
        bind:
          create_host_path: false
    env_file:
      - /www/dk_project/folio-studio/config/studio.env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      HOST: 127.0.0.1
      PORT: '18080'
      SERVE_PUBLIC: 'true'
      COOKIE_SECURE: 'true'
      PUBLIC_ORIGIN: https://www.jasonshelter.com
      PRODUCTION_URL: https://www.jasonshelter.com
      PREVIEW_BASE_PATH: /preview
      FOLIO_DATA_DIR: /data
      FOLIO_CACHE_DIR: /tmp/astro-cache
      ASTRO_TELEMETRY_DISABLED: '1'
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "try { const r = await fetch('http://127.0.0.1:18080/healthz', {signal: AbortSignal.timeout(4000)}); process.exit(r.status === 200 ? 0 : 1); } catch { process.exit(1); }"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
