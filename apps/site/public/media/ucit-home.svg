    <path d="M780 247c93 88 91 238-1 327" stroke-opacity=".48" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M720 613c-111 61-258 26-327-77" stroke-opacity=".48" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M354 477c-34-76-18-164 37-226" stroke-opacity=".48" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M443 382h314M600 225v314" stroke-opacity=".17"/>
    <circle cx="600" cy="382" r="92" stroke-opacity=".15"/>
    <circle cx="600" cy="382" r="128" stroke-opacity=".08"/>
  </g>
