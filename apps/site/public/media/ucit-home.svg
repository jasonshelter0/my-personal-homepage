<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">UCIT Home workflow</title>
  <desc id="desc">A quiet loop moves commitments through planning, action, waiting, evidence, and closure.</desc>
  <defs>
