  <text x="64" y="81" fill="#d7e5ef" font-family="sans-serif" font-size="22" letter-spacing="6">UCIT HOME / COMMITMENTS</text>
  <text x="64" y="704" fill="#7892a5" font-family="monospace" font-size="16">PLAN — ACT — EVIDENCE — CLOSE</text>
